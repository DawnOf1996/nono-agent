[project]
name = "session-viewer"
version = "0.1.0"
description = "Nono Agent 会话轨迹可视化前端（给定 session_id 或离线 .jsonl 会话文件）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

# 这是一个「脚本 + 静态文件」的非包项目：uv 只负责管理依赖虚拟环境，
# 不尝试把项目本身 build/install 成包（没有 [project.scripts]，也不打包）。
[tool.uv]
package = false
