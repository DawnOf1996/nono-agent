[project]
name = "nono-agent"
version = "0.1.0"
description = "A Python AI Agent engine inspired by Claude Code's QueryEngine architecture"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Nono" }]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.50",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.0",
    "aiofiles>=24.0",
    "pyyaml>=6.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
