[project]
name = "nono-agent"
version = "0.1.0"
description = "A Python AI Agent engine inspired by Claude Code's QueryEngine architecture"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Nono" }]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.50",
    "structlog>=24.0",
    "aiofiles>=24.0",
    "pyyaml>=6.0",
    "zstandard>=0.23",
    "mcp>=2.0,<3",
    # 上下文占用的 token 估算。缺了会退回 len//4，对工具 JSON schema 低估 ~40%，
    # 面板上的「上下文已用」会明显偏小。见 nono_agent/utils/tokens.py。
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "nono-app-cli",
    "nono-app-server",
]

[tool.uv.sources]
nono-app-cli = { path = "apps/cli", editable = true }
nono-app-server = { path = "apps/server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/server", "apps/cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["nono_agent", "nono_app_cli", "nono_app_server", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
