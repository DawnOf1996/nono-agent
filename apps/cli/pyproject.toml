[project]
name = "nono-app-cli"
version = "0.1.0"
description = "Terminal CLI wrapping the nono-agent QueryEngine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "nono-agent",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
nono = "nono_app_cli.app:main"
nono-app-cli = "nono_app_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nono_app_cli"]

[tool.uv.sources]
nono-agent = { path = "../../", editable = true }
