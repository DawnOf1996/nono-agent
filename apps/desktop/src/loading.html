<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>NoNo</title>
    <script>
      // 先于任何样式把主题定死，否则首帧会用 html 的默认白底闪一下。
      // 主题由主进程通过 ?theme= 传进来：loading.html 走 file://，而应用本体在
      // http://127.0.0.1:<port>，两者 localStorage 不同源，读不到应用存的主题，
      // 所以只能靠 nativeTheme 系统值（与 src/lib/theme.ts 的 system 默认一致）。
      (function () {
        var forced = new URLSearchParams(location.search).get("theme");
        var dark =
          forced === "dark" ||
          (forced !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.dataset.theme = dark ? "dark" : "light";
        r.style.background = dark ? "#16181d" : "#ffffff";
      })();
    </script>
    <style>
      /* 色值与 apps/web/src/index.css 的两套 token 对齐：加载页和应用本体之间
         不再有一次明暗翻转，切换 loadURL 时用户看不到颜色跳变。 */
      :root[data-theme="dark"] {
        --bg: #16181d;
        --ink: #e6e8ec;
        --muted: #9aa0ab;
        --line: #2a2f38;
        --accent: #7aa2ff;
        --logo-ring: rgba(255, 255, 255, 0.07);
        --logo-shadow: rgba(0, 0, 0, 0.5);
      }
      :root[data-theme="light"] {
        --bg: #ffffff;
        --ink: #0f1115;
        --muted: #6b7280;
        --line: #e7e9ee;
        --accent: #4176e6;
        --logo-ring: rgba(15, 17, 21, 0.06);
        --logo-shadow: rgba(15, 17, 21, 0.16);
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        user-select: none;
      }

      .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 10px 30px var(--logo-shadow), 0 0 0 1px var(--logo-ring);
        /* 主题切换到浅色时 logo 已是深色块，不需要反色 */
      }

      .name {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.06em;
        margin: 0;
      }

      /* 不确定进度条：不谎报百分比，只表达「还在动」。 */
      .bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        animation: slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(345%); }
      }

      .status {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        min-height: 1.2em;
        transition: opacity 0.25s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .bar > i { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="./loading-logo.png" alt="" />
      <p class="name">NoNo</p>
      <div class="bar"><i></i></div>
      <p class="status" id="status">正在启动本地服务…</p>
    </div>
    <script>
      // 文案只说真话：sidecar 没就绪之前没有任何可报的进度，所以不编百分比，
      // 只在等待变长时把预期讲清楚，免得用户以为卡死。
      (function () {
        var el = document.getElementById("status");
        var started = Date.now();
        var STAGES = [
          [0, "正在启动本地服务…"],
          [4000, "首次启动需要多花一点时间…"],
          [10000, "仍在启动…若一直没有反应，请重启应用"],
        ];
        var shown = -1;
        setInterval(function () {
          var elapsed = Date.now() - started;
          var text = STAGES[0][1];
          for (var i = 0; i < STAGES.length; i += 1) {
            if (elapsed >= STAGES[i][0]) text = STAGES[i][1];
          }
          if (text === shown) return;
          shown = text;
          el.style.opacity = "0";
          setTimeout(function () {
            el.textContent = text;
            el.style.opacity = "1";
          }, 200);
        }, 500);
      })();
    </script>
  </body>
</html>
