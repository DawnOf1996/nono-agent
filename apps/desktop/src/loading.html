<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NoNo</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #14181f;
        color: #d7dde8;
        font-family: "Segoe UI", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .spin {
        width: 28px;
        height: 28px;
        border: 3px solid #2a3342;
        border-top-color: #7aa2ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { margin: 0; font-size: 14px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spin"></div>
      <p>正在启动 NoNo…</p>
    </div>
  </body>
</html>
